# Copy .env.example to .env and fill in both passwords before the first start.
x-database-environment: &database-environment
  POSTGRES_USER: ${POSTGRES_USER:-iptable}
  POSTGRES_DB: ${POSTGRES_DB:-iptable}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-} # Required: choose your database password.

x-app-environment: &app-environment
  <<: *database-environment
  APP_ENV: production
  POSTGRES_HOST: postgres
  POSTGRES_APP_USER: ${POSTGRES_APP_USER:-auto}
  DATABASE_URL: ${DATABASE_URL:-} # Optional override for an existing database.
  SECRET_KEY_FILE: /run/iptable/secret-key
  # Public URL controls Secure cookies and HSTS, including behind an external proxy.
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:${APP_PORT:-8000}}
  HTTPS_ENABLED: ${HTTPS_ENABLED:-false}
  MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-3145728}

x-app: &app
  image: ${COMPOSE_PROJECT_NAME:-iptable}-app
  build: .
  environment: *app-environment
  volumes:
    - installation_key:/run/iptable:ro

services:
  postgres:
    image: ${COMPOSE_PROJECT_NAME:-iptable}-postgres
    build: ./deploy/postgres
    environment: *database-environment
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    environment:
      <<: *app-environment
      POSTGRES_APP_USER: ""
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-${DATABASE_URL:-}}
      SECRET_KEY: ${SECRET_KEY:-} # Import the existing key once on upgrade.
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INTERFACE_LANGUAGE: ${INTERFACE_LANGUAGE:-EN}
      INTERFACE_THEME: ${INTERFACE_THEME:-blue}
    volumes:
      - installation_key:/run/iptable
    command: ["python", "-m", "app.manage", "migrate", "--runtime-role", "${POSTGRES_APP_USER:-auto}"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    environment:
      <<: *app-environment
      ENABLE_PING_WORKER: "false"
      POSTGRES_PASSWORD: ""
      FORWARDED_ALLOW_IPS: ${TRUSTED_PROXY_IPS:-127.0.0.1}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *app-environment
      ENABLE_PING_WORKER: "true"
      POSTGRES_PASSWORD: ""
    depends_on:
      migrate:
        condition: service_completed_successfully
    cap_add: [NET_RAW]
    healthcheck:
      test: ["CMD", "python", "-c", "from sqlalchemy import text; from app.core.database import engine; c = engine.connect(); c.execute(text('select 1')); c.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  installation_key:
