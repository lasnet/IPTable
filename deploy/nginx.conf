worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    # Do not log URLs, query strings, cookies or imported inventory data.
    log_format minimal '$remote_addr $request_method $status $body_bytes_sent';
    access_log /dev/stdout minimal;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 3m;
    client_body_timeout 30s;
    send_timeout 60s;

    server {
        listen 127.0.0.1:8080;
        location = /health {
            access_log off;
            return 200 'ok';
        }
        location / { return 404; }
    }

    server {
        listen 8443 ssl;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        resolver 127.0.0.11 valid=10s ipv6=off;

        location / {
            # Runtime DNS resolution also handles replacement of the web container.
            set $backend web:8000;
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
        }
    }
}
