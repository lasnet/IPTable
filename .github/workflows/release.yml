name: Publish release image

on:
  # checkov:skip=CKV_GHA_7:Only a validated version tag on main is accepted, not free-form build arguments.
  workflow_dispatch:
    inputs:
      version:
        description: "Existing main-branch tag: v1.2.3 or v1.2.3-rc.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          commit=$(git rev-parse "refs/tags/$VERSION^{commit}")
          git merge-base --is-ancestor "$commit" origin/main
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.commit }}

  publish:
    needs: [validate, checks]
    runs-on: ubuntu-latest
    # Configure required approval for this environment before the first release.
    environment: release
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing version
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "Version already exists; choose a new release tag."
            exit 1
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ needs.validate.outputs.image }}:${{ inputs.version }}
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ needs.validate.outputs.commit }}
            SOURCE=https://github.com/${{ github.repository }}
          provenance: true
          sbom: true
