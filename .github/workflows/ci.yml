name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: local
      ENABLE_PING_WORKER: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m bandit -r app scripts -ll
      - run: python -m pip_audit -r requirements.txt --cache-dir .cache/pip-audit

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 git /repo --redact=100 --log-opts=--all --no-banner

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: iptable-ci
      APP_PORT: "18000"
      APP_BIND_ADDRESS: "127.0.0.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Generate disposable test secrets
        run: |
          for setting in POSTGRES_PASSWORD SECRET_KEY INITIAL_ADMIN_PASSWORD; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$setting=$value" >> "$GITHUB_ENV"
          done
      - name: Build and start the documented installation
        run: |
          docker compose build web
          docker compose up -d --no-build --wait --wait-timeout 180
      - name: Test login and ping
        run: |
          python3 scripts/smoke_test.py --url http://127.0.0.1:18000
          docker compose exec -T worker ping -c 1 -W 2 postgres
      - name: Test PostgreSQL backup and restore
        run: |
          scripts/backup_postgres.sh backups/ci.dump
          test -s backups/ci.dump
          docker compose stop web worker
          CONFIRM_RESTORE=YES scripts/restore_postgres.sh backups/ci.dump
          docker compose up -d --no-build --wait --wait-timeout 180
          python3 scripts/smoke_test.py --url http://127.0.0.1:18000
      - name: Service status
        if: always()
        run: docker compose ps -a
      - name: Stop disposable test stack
        if: always()
        run: docker compose down -v
